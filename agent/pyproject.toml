[project]
name = "gemini-agent"
version = "0.1.0"
description = "LiveKit Agent for Gemini Playground"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "livekit>=0.19.0",
    "livekit-agents>=1.8.3",
    "livekit-plugins-google>=1.8.3",
    "python-dotenv",
    "google-genai>=2.25.0",
    "typesafe-sdk",
    "packaging>=21.0",
    "socksio>=1.0.0",
    "httpx[socks]>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

