name: Deploy Agent to LiveKit Cloud

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to perform"
        required: true
        type: choice
        options:
          - deploy
        default: "deploy"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ${{ github.workflow }}-agent
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Create temporary livekit.toml
        run: |
          cat > agent/livekit.toml << 'EOF'
          [project]
            subdomain = "smj-agitdtnk"

          [agent]
            id = "CA_K5ABztZkb3G4"
          EOF
          echo "✅ Created temporary livekit.toml for deployment"
          cat agent/livekit.toml

      - name: Deploy LiveKit Cloud Agent
        if: github.event.inputs.operation == 'deploy'
        uses: livekit/deploy-action@v2.12.1
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          # The agent reads its keys from its own environment; they are no
          # longer handed over by the browser. Both secrets have to exist in
          # the "production" environment before deploying.
          SECRET_LIST: GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},JEV_API_KEY=${{ secrets.JEV_API_KEY }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: agent

      - name: Deployment summary
        if: github.event.inputs.operation == 'deploy'
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Working Directory:** agent" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
